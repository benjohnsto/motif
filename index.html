<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Simple Annotation Tool</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>
<div id="myviewer" style="width:700px;height:800px;display:block;"></div>

<script src="dist/motif.js?v=2"></script>
<script src="adapters/LocalStorageAdapter.js"></script>
<script>
//https://data.artmuseum.princeton.edu/iiif/objects/32499
//https://figgy.princeton.edu/concern/scanned_resources/b592d95a-6c86-47ee-bec4-643e1f0cb1eb/manifest
//https://localhost/mixtape/136/manifest

  var c = new Motif({
    'id':'myviewer',
    'mode': 'edit',
    'manifest': 'https://collections.library.yale.edu/manifests/16986907',
    'showNav': true,
    'annotation': {
      "adapter": new LocalStorageAdapter('', 'http://localhost/nanostore3')
    }    
  });
</script>
    
    
</body>
</html>
