<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliiicer: Simple Annotation Tool</title>
    
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
    #gallery {
      margin-top:2em;
      display:grid;
      grid-template-columns: repeat(5, 10rem); 
      grid-template-rows: 10rem; 
      grid-gap:0.5em;
    } 
    .block{
     background:#EEE;
     padding:1em;
    }
    </style>
</head>
<body>
<div id="myviewer" style="width:100%;height:800px;display:block;"></div>

<script src="dist/motif.js?v=2"></script>
<script src="adapters/NanostoreAdapter.js"></script>
<script>
//https://data.artmuseum.princeton.edu/iiif/objects/32499

  var c = new Motif({
    'id':'myviewer',
    'mode': 'edit',
    'manifest': 'https://figgy.princeton.edu/concern/scanned_resources/b592d95a-6c86-47ee-bec4-643e1f0cb1eb/manifest'      
  }, new NanostoreAdapter('', 'http://localhost/nanostore3'));
</script>
    
    
</body>
</html>
